[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pact-mcp"
version = "0.1.0"
description = "One MCP endpoint that gives each AI agent a curated, permissioned set of SaaS tools, configured as YAML in Git."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Andrey Olishchuk" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "iam", "permissions", "freshdesk", "jira", "wrike"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastmcp>=4.1,<5",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pact_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Connector `settings = {...}` is a declarative class attribute typed ClassVar on the base class.
ignore = ["RUF012"]
