# Example of a narrowly scoped agent. It has no PACT_AGENT__SUPPORT_BOT__KEY in the
# example .env, so it cannot connect until you add one. It also has no service user, so
# it only works for signed-in people (forwarded SSO token) until users.yaml gives it one.
agent: support-bot
owner: support-lead@example.com
description: Reads helpdesk tickets and files follow-up issues in Jira.

roles:
  - freshdesk:reader
  - jira:reader

# Explicit deny always wins, even over roles added later.
deny:
  - "*:*:delete"
  - "*:*:send"

# No pii toleration: contacts are hidden and personal fields are redacted.
tolerations: []
